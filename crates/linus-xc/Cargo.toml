[package]
name = "linus-xc"
description = "Exchange-correlation functionals for linus: a backend-agnostic XC trait, with libxc 7.0.0 (static, via FFI) as the first backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
# We link the native library `xc` (libxc). Declaring it makes Cargo refuse a
# second crate that also links libxc, and exports DEP_XC_ROOT / DEP_XC_INCLUDE
# to direct dependents.
links = "xc"
build = "build.rs"

[features]
# The libxc sources of the functionals a GPU evaluates on the device (`device` module): extracted
# from the libxc tarball at build time and compiled by the GPU engines at run time (linus-gpu's
# `gpu` feature turns it on). Changes nothing on the CPU.
device-sources = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
rayon.workspace = true

[build-dependencies]
cmake = "0.1.54"
cc = "1.2"
sha2 = "0.10"
